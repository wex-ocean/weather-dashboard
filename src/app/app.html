<main class="container">
  <h1>Weather Dashboard</h1>
  <app-search-bar (search)="onSearch($event)" />

  @if (loading()) {
    <p class="status">Loading...</p>
  } @else if (error()) {
    <p class="status error">{{ error() }}</p>
  } @else if (weather(); as data) {
    <app-weather-card [weather]="data" />
  }
</main>
