<main class="container">
  <h1>Weather Dashboard</h1>
  <app-search-bar (search)="onSearch($event)" />

  @if (recent().length) {
    <div class="recent">
      @for (city of recent(); track city) {
        <button type="button" (click)="onSearch(city)">{{ city }}</button>
      }
    </div>
  }
  <button type="button" class="unit-toggle" (click)="toggleUnit()">
    Switch to °{{ unit() === 'C' ? 'F' : 'C' }}
  </button>
  @if (loading()) {
    <p class="status">Loading...</p>
  } @else if (error()) {
    <p class="status error">{{ error() }}</p>
  } @else if (weather(); as data) {
    <app-weather-card [weather]="data" [unit]="unit()" />
    <app-forecast [days]="forecast()" [unit]="unit()" />
  }
</main>
